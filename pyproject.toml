[project]
name = "quant-trader"
version = "0.1.0"
description = "ML quant pipeline (paper trading only)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "apscheduler>=3.10,<4",
    "exchange-calendars>=4.13.3",
    "feedparser>=6.0.14",
    "hmmlearn==0.3.3",
    "httpx>=0.28.1",
    "lxml>=6.0",
    "pandas>=3.1.1",
    "psycopg[binary,pool]>=3.3.9",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.10",
    "scikit-learn>=1.6",
    "trafilatura>=2.4.0",
    "yfinance>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs the Docker TimescaleDB (skipped if it is not reachable)",
    "slow: slow test",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
