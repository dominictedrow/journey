[project]
name = "trader"
version = "0.1.0"
description = "Research trading bot: switchable strategy modes, after-cost competition (no live trading)."
requires-python = ">=3.13"
dependencies = [
    "numpy==2.3.4",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "exchange-calendars==4.11.1",
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
