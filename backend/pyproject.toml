[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copytrader-backend"
version = "0.1.0"
description = "Polymarket intelligence & copy-trading platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "web3>=7,<8",
    "py-clob-client>=0.17",
    "websockets>=10",
    "celery[redis]>=5.3,<6",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerated files are exempt from hand-written style rules
extend-exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "app/database/migrations/versions"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
