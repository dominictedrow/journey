[package]
name = "copytrader"
version = "0.1.0"
description = "Copytrader thin-client desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The mobile-ready split: main.rs is a thin launcher over this lib.
name = "copytrader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
