name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t copytrader-backend .
      - name: Lint (ruff)
        run: docker run --rm copytrader-backend ruff check .
      - name: Format check (black)
        run: docker run --rm copytrader-backend black --check .
      - name: Type check (mypy)
        run: docker run --rm copytrader-backend mypy app
      - name: Tests (pytest)
        run: docker run --rm copytrader-backend pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check (tsc)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
