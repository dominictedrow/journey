# Phase 3 feature layer (docs/components/03_features.md, D-033). Every number lives here.

# Price inputs (section 3, D-030): raw bars are adjusted in memory, never written back.
bars:
  # Per asset and bar date the first source present wins. Equities and ETFs come from Alpaca;
  # yfinance fills index/futures/FX and ETF history before Alpaca's 2016 start.
  # alpaca_succ: real history refetched under a successor symbol (collect.identity_overrides).
  source_priority: [alpaca, alpaca_succ, yfinance]
  # yfinance Close is split-adjusted as of the fetch (D-031), so never mix it with Alpaca bars
  # for an asset class that splits; only these classes may take yfinance bars.
  yfinance_classes: [etf, index, future, fx]
  # Alpaca serves flat zero-volume filler bars around delistings (D-030): drop them for traded
  # classes. Index levels legitimately report zero volume.
  drop_zero_volume_classes: [equity, etf, crypto]

adjust:
  splits: true                      # forward, reverse and unit splits: price x old/new
  dividends: true                   # total-return: price x (1 - D / prior close) before ex date
  special_dividends: true
  # Ignored kinds (logged once per run): spin-offs carry no price ratio in Alpaca's payload, and
  # mergers/name changes don't change the price path of the surviving security.
  ignore_kinds: [ca_spin_offs, ca_cash_mergers, ca_stock_mergers, ca_stock_and_cash_mergers,
                 ca_name_changes, ca_stock_dividends]
  # A dividend larger than this share of the prior close is treated as a data error and skipped
  # (KDP's 2018 special was 84% of the price, so this is only a guard against garbage).
  max_dividend_frac: 0.9
  # A split is applied only if the raw price move into its ex date agrees with its ratio within
  # this many log points (ln 2: a real split plus at most a 2x move that day). Catches Alpaca
  # rows that are really spin-offs (CNX 2017) or belong to a later holder of the symbol (PARA
  # 2026). Needs a bar within split_bar_window_days on both sides of the ex date.
  split_check_tol: 0.693
  split_bar_window_days: 10
  # Actions missing from Alpaca, added by hand (each with a source). Applied like Alpaca rows,
  # without the size guard. released_at = ex date 00:00 ET (same rule as pit.corp_action).
  manual:
    - {security_key: "SPX:KDP:2015-12-31", kind: ca_cash_dividends, ex_date: "2018-07-10",
       rate: 103.75, special: true,
       source: "Keurig Dr Pepper merger special dividend to DPS holders (8-K 2018-07-09)"}

# Per-asset price features (section 5.1). Windows are in bars (rows), not calendar days. Feature
# names carry their window (ret_21d), so a new window here is a new feature and a changed
# definition of an existing name fails the registry sync until its version is bumped.
price:
  annualization: {default: 252, crypto: 365}
  # Beta/correlation benchmark per asset class (spec: OLS on SPY, coins on BTC).
  bench: {default: SPY, crypto: BTC/USD}
  # Paired-return features (beta, residual vol, correlations) need this share of the window to
  # have both returns on the same date. Coins trade 7 days and SPY/DXY/10y 5, so a coin's 63
  # bars hold ~45 weekday pairs (0.71): 0.6 lets those through. Stocks pair on ~every bar.
  min_pair_frac: 0.6
  returns: [1, 5, 21, 63, 126, 252]   # log return over n bars
  momentum: {long: 252, skip: 21}      # 12-1: log(P[t-21] / P[t-252])
  rvol: [21, 63]                       # stdev of daily log returns, annualized
  gk_vol: [21]                         # Garman-Klass
  downside_dev: [63]                   # sqrt(mean(min(r, 0)^2)), annualized
  max_dd: [63, 252]                    # worst peak-to-trough inside the last n closes
  sma: {fast: 50, slow: 200}
  rsi: 14                              # simple-average (Cutler) RSI: finite window, no seed effect
  # EMAs are truncated to trunc_spans x span bars (weights renormalized) so a value never
  # depends on where the loaded history starts. (1 - 2/(26+1))^104 = 3e-4 of weight dropped.
  macd: {fast: 12, slow: 26, signal: 9, trunc_spans: 4}
  bollinger: {window: 20, k: 2.0}
  atr: 14                              # simple mean of true range / close
  volume_z: 21                         # log volume vs the previous n bars
  amihud: {window: 21, scale: 1.0e9}   # mean(|r| / dollar volume) x scale
  beta: [63, 252]                      # OLS beta and residual vol vs the bench
  corr:
    window: 63
    # context series -> where the builder takes it from (asset ticker, or FRED series: changes)
    series: {spy: SPY, dxy: DX-Y.NYB, y10: DGS10}
  mr_z: 63                             # (ln P - mean) / stdev of ln P over n
  ou: {window: 126, halflife_cap: 504} # no mean reversion (b >= 0) or longer -> the cap
  hurst: {window: 126, q: 10}          # variance ratio of q-bar vs 1-bar returns (Q4)
  earnings:
    # Backfilled report dates are known only 7 days ahead (D-031: report - 7 d), so history never
    # shows more than 5 sessions; live sees 28 days ahead. Capping at 5 keeps the feature's
    # training and live ranges the same (no report known within 5 sessions -> NaN).
    max_sessions_ahead: 5
