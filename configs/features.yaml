# Phase 3 feature layer (docs/components/03_features.md, D-033). Every number lives here.

# Price inputs (section 3, D-030): raw bars are adjusted in memory, never written back.
bars:
  # Per asset and bar date the first source present wins. Equities and ETFs come from Alpaca;
  # yfinance fills index/futures/FX and ETF history before Alpaca's 2016 start.
  # alpaca_succ: real history refetched under a successor symbol (collect.identity_overrides).
  source_priority: [alpaca, alpaca_succ, yfinance]
  # yfinance Close is split-adjusted as of the fetch (D-031), so never mix it with Alpaca bars
  # for an asset class that splits; only these classes may take yfinance bars.
  yfinance_classes: [etf, index, future, fx]
  # Alpaca serves flat zero-volume filler bars around delistings (D-030): drop them for traded
  # classes. Index levels legitimately report zero volume.
  drop_zero_volume_classes: [equity, etf, crypto]

adjust:
  splits: true                      # forward, reverse and unit splits: price x old/new
  dividends: true                   # total-return: price x (1 - D / prior close) before ex date
  special_dividends: true
  # Ignored kinds (logged once per run): spin-offs carry no price ratio in Alpaca's payload, and
  # mergers/name changes don't change the price path of the surviving security.
  ignore_kinds: [ca_spin_offs, ca_cash_mergers, ca_stock_mergers, ca_stock_and_cash_mergers,
                 ca_name_changes, ca_stock_dividends]
  # A dividend larger than this share of the prior close is treated as a data error and skipped
  # (KDP's 2018 special was 84% of the price, so this is only a guard against garbage).
  max_dividend_frac: 0.9
  # A split is applied only if the raw price move into its ex date agrees with its ratio within
  # this many log points (ln 2: a real split plus at most a 2x move that day). Catches Alpaca
  # rows that are really spin-offs (CNX 2017) or belong to a later holder of the symbol (PARA
  # 2026). Needs a bar within split_bar_window_days on both sides of the ex date.
  split_check_tol: 0.693
  split_bar_window_days: 10
  # Actions missing from Alpaca, added by hand (each with a source). Applied like Alpaca rows,
  # without the size guard. released_at = ex date 00:00 ET (same rule as pit.corp_action).
  manual:
    - {security_key: "SPX:KDP:2015-12-31", kind: ca_cash_dividends, ex_date: "2018-07-10",
       rate: 103.75, special: true,
       source: "Keurig Dr Pepper merger special dividend to DPS holders (8-K 2018-07-09)"}

# Per-asset price features (section 5.1). Windows are in bars (rows), not calendar days. Feature
# names carry their window (ret_21d), so a new window here is a new feature and a changed
# definition of an existing name fails the registry sync until its version is bumped.
price:
  annualization: {default: 252, crypto: 365}
  # Beta/correlation benchmark per asset class (spec: OLS on SPY, coins on BTC).
  bench: {default: SPY, crypto: BTC/USD}
  # Paired-return features (beta, residual vol, correlations) need this share of the window to
  # have both returns on the same date. Coins trade 7 days and SPY/DXY/10y 5, so a coin's 63
  # bars hold ~45 weekday pairs (0.71): 0.6 lets those through. Stocks pair on ~every bar.
  min_pair_frac: 0.6
  returns: [1, 5, 21, 63, 126, 252]   # log return over n bars
  momentum: {long: 252, skip: 21}      # 12-1: log(P[t-21] / P[t-252])
  rvol: [21, 63, 252]                  # stdev of daily log returns, annualized (252: low-vol composite)
  gk_vol: [21]                         # Garman-Klass
  downside_dev: [63]                   # sqrt(mean(min(r, 0)^2)), annualized
  max_dd: [63, 252]                    # worst peak-to-trough inside the last n closes
  sma: {fast: 50, slow: 200}
  rsi: 14                              # simple-average (Cutler) RSI: finite window, no seed effect
  # EMAs are truncated to trunc_spans x span bars (weights renormalized) so a value never
  # depends on where the loaded history starts. (1 - 2/(26+1))^104 = 3e-4 of weight dropped.
  macd: {fast: 12, slow: 26, signal: 9, trunc_spans: 4}
  bollinger: {window: 20, k: 2.0}
  atr: 14                              # simple mean of true range / close
  volume_z: 21                         # log volume vs the previous n bars
  amihud: {window: 21, scale: 1.0e9}   # mean(|r| / dollar volume) x scale
  beta: [63, 252]                      # OLS beta and residual vol vs the bench
  corr:
    window: 63
    # context series -> where the builder takes it from (asset ticker, or FRED series: changes)
    series: {spy: SPY, dxy: DX-Y.NYB, y10: DGS10}
  mr_z: 63                             # (ln P - mean) / stdev of ln P over n
  ou: {window: 126, halflife_cap: 504} # no mean reversion (b >= 0) or longer -> the cap
  hurst: {window: 126, q: 10}          # variance ratio of q-bar vs 1-bar returns (Q4)
  earnings:
    # Backfilled report dates are known only 7 days ahead (D-031: report - 7 d), so history never
    # shows more than 5 sessions; live sees 28 days ahead. Capping at 5 keeps the feature's
    # training and live ranges the same (no report known within 5 sessions -> NaN).
    max_sessions_ahead: 5

# Fundamentals (section 5.2 inputs). EDGAR facts as known at T: for each fiscal period the newest
# released value wins (restatements included once filed). Per period, the first tag present in
# the list wins (companies switch tags, e.g. Revenues -> RevenueFromContract... with ASC 606).
# "A+B": a sum at the same instant; the first term is required, later ones count 0 if absent.
fundamentals:
  concepts:
    revenue: [us-gaap:Revenues, us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax,
              us-gaap:SalesRevenueNet, us-gaap:RevenuesNetOfInterestExpense]
    cost_of_revenue: [us-gaap:CostOfRevenue, us-gaap:CostOfGoodsAndServicesSold,
                      us-gaap:CostOfGoodsAndServiceExcludingDepreciationDepletionAndAmortization]
    gross_profit: [us-gaap:GrossProfit]          # else revenue - cost_of_revenue, per quarter
    operating_income: [us-gaap:OperatingIncomeLoss]   # else revenue - costs_and_expenses (same E)
    costs_and_expenses: [us-gaap:CostsAndExpenses, us-gaap:OperatingCostsAndExpenses]
    net_income: [us-gaap:NetIncomeLoss]
    eps_diluted: [us-gaap:EarningsPerShareDiluted]
    da: [us-gaap:DepreciationDepletionAndAmortization, us-gaap:DepreciationAndAmortization,
         us-gaap:DepreciationAmortizationAndAccretionNet, us-gaap:Depreciation]
    income_tax: [us-gaap:IncomeTaxExpenseBenefit]
    pretax_income:
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments
    cfo: [us-gaap:NetCashProvidedByUsedInOperatingActivities]
    capex: [us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, us-gaap:PaymentsToAcquireProductiveAssets,
            us-gaap:PaymentsToAcquireOilAndGasPropertyAndEquipment]
    equity: [us-gaap:StockholdersEquity]
    cash: [us-gaap:CashAndCashEquivalentsAtCarryingValue,
           us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents]
    # LongTermDebt includes its current portion; Noncurrent doesn't, so it gets the current part
    debt:
      - us-gaap:LongTermDebt+us-gaap:ShortTermBorrowings
      - us-gaap:LongTermDebtNoncurrent+us-gaap:LongTermDebtCurrent+us-gaap:ShortTermBorrowings
      - us-gaap:LongTermDebtAndCapitalLeaseObligations+us-gaap:LongTermDebtCurrent+us-gaap:ShortTermBorrowings
      - us-gaap:LongTermDebtAndCapitalLeaseObligations+us-gaap:LongTermDebtAndCapitalLeaseObligationsCurrent+us-gaap:ShortTermBorrowings
      - us-gaap:DebtInstrumentCarryingAmount+us-gaap:ShortTermBorrowings
    shares: [dei:EntityCommonStockSharesOutstanding]
  # Units kept per input (anything else, e.g. EPS tagged in "pure" or CHF dividends, is dropped).
  units: {eps_diluted: USD/shares, shares: shares, default: USD}
  quarter_days: [80, 100]             # a duration this long is a quarter
  annual_days: [350, 380]             # ... or a fiscal year
  step_tol_days: 10                   # consecutive quarter ends: 91 +- this; YoY: 365 +- this
  max_age_days: 200                   # period end older than this at the bar date -> NaN
  gm_quarters: 8                      # gross-margin stability: stdev over this many quarters
  tax: {default_rate: 0.21, max_rate: 0.5}   # ROIC tax rate = tax / pretax, clipped; else default
  eps_yoy_min_base: 0.05              # |EPS a year ago| below this (USD) -> NaN (growth undefined)
  split_guard_years: 2                # EPS YoY -> NaN if a split's ex date is this close (EPS
                                      # bases before/after a split may not be restated alike)
  # Many filers tag debt only with company extensions, which standard tags can't see: their debt
  # stays NaN. A company that has never filed any debt option (by T) is treated as debt-free (0).
  debt_absent_as_zero: true
  # Banks and REITs: EBITDA-based ratios are undefined, so NaN (not a fudged value)
  no_ebitda_sectors: [Financials, Real Estate]

# Cross-section (section 5.2): percentile ranks across the point-in-time S&P 500 members at T,
# and again within sector. Average rank for ties; NaN stays out of the rank and stays NaN.
cross_section:
  index_code: SPX
  min_sector_size: 5                  # fewer valid members in a sector -> sector rank NaN
  # Ranked: these groups' features (earnings proximity is a calendar fact, not a factor).
  rank_groups: [price_returns, price_vol, price_trend, price_liquidity, price_market_link,
                price_mean_reversion, fundamentals]
  min_components: 2                   # a composite needs this many component ranks
  # Composite -> components; "-x" ranks the negative (lower is better).
  composites:
    value: [earnings_yield, fcf_yield, ebitda_ev]
    quality: [roic, gm_stability, -net_debt_ebitda]
    momentum: [mom_12_1, ret_63d]
    low_vol: [-rvol_252d, -beta_252d]
    growth: [revenue_yoy, eps_yoy]

# Market vector (section 5.3). Computed at each decision time T from what is known at T: macro
# from the ALFRED vintages released by T (MacroState), prices from bars released by T. "n-day"
# windows count XNYS sessions; a series is sampled at each session as its latest observation dated
# on or before it (so weekly/monthly series forward-fill, never back-fill).
market:
  z_window: 252                       # rolling z-scores: latest vs the last n session samples
  chg_window: 21                      # "21-day change"
  ret_window: 21
  corr_window: 63
  ratio_window: 63                    # risk-appetite ratios: 63-day log return of A/B
  infl_months: {short: 3, long: 12}   # 3-month annualized - YoY
  sahm: {avg_months: 3, lookback_months: 12}
  nfci_chg_days: 28                   # NFCI 4-week change (calendar days)
  claims: {avg_weeks: 4, yoy_days: 364}
  gold_resid: {fit_window: 252, horizon: 21}   # 21-day gold residual vs a 252-day fit on dDFII10
  gli:
    window_days: 91                   # 13-week % change (calendar days)
    # USD billions = sum of sign x factor x series [x or / fx]; units checked on FRED 2026-11-26
    terms:
      - {series: WALCL, factor: 0.001}                 # millions USD
      - {series: WTREGEN, factor: -0.001}              # millions USD (TGA)
      - {series: RRPONTSYD, factor: -1.0}              # billions USD
      - {series: ECBASSETSW, factor: 0.001, fx: DEXUSEU, fx_op: mul}   # millions EUR x USD/EUR
      - {series: JPNASSETS, factor: 0.1, fx: DEXJPUS, fx_op: div}      # 100M JPY / JPY per USD
  # ALFRED quirks, applied when macro rows are loaded (inputs.load_macro):
  macro_fixes:
    # FRED re-based WTREGEN from billions to millions on 2025-11-13: older vintages are scaled to
    # the current unit (checked: every period's value x1000 at that vintage; no other series has
    # a systematic jump between vintages).
    unit_changes:
      - {series: WTREGEN, before_vintage: "2025-11-13", multiply: 1000}
    # Series that entered ALFRED long after the observations they carry (ECBASSETSW: first
    # vintage 2020-02-25). The first vintage's rows count as released this many days after their
    # period (the series' median lag), instead of on 2020-02-25. Approximate, like the earnings
    # backfill; without it the GLI has no history before 2020.
    late_listed_lag_days: {ECBASSETSW: 7}
  # Price inputs by ticker (adjusted closes; ETFs carry dividends, like price.py context series)
  tickers: {spy: SPY, tlt: TLT, vnq: VNQ, vix: "^VIX", vix3m: "^VIX3M", dxy: DX-Y.NYB,
            gold: GC=F, copper: HG=F, wti: CL=F, move: "^MOVE", skew: "^SKEW", vvix: "^VVIX",
            btc: BTC/USD, eth: ETH/USD}
  ratios:                             # ratio_<a>_<b>_63d
    - [IWM, SPY]
    - [RSP, SPY]
    - [XLY, XLP]
    - [SOXX, SPY]
    - [KRE, SPY]
    - [EEM, SPY]
    - [HYG, IEF]
  # Event clock (step 4b, D-039). "Days" are calendar days from T's New York date; the next event
  # is the first one whose release instant is after T.
  events:
    fomc_statement_et: "14:00"
    cpi_release_et: "08:30"
    earnings_heavy_share: 0.20        # an earnings-heavy week: >= 20% of PIT members report in it
    # Report dates count only up to T + this many days, the backfill's visibility (collect.pit.
    # earnings_backfill_lead_days); live sees 28 days, so training and live see the same horizon
    earnings_visible_days: 7
  # Crypto structure (step 4b, D-039). Windows are calendar days (crypto trades 7 days a week).
  crypto:
    symbols: [BTC, ETH]               # funding, OI / market cap and ETF flows per coin
    dominance_chg_days: 21
    stable_chg_days: 30
    funding_days: 7
    funding_venues: [okx, hyperliquid]
    funding_min_coverage: 0.9         # a venue counts if its settlements cover 90% of the window
    oi_venues: [okx, hyperliquid, deribit, kraken]   # OI = USD sum over all four (D-026), else NaN
    oi_max_age_h: 26                  # newest OI snapshot per venue must be this recent
    max_age_days: 2                   # dominance, market cap, stablecoin supply: newest obs age
    match_tolerance_days: 2           # "n days ago" = newest obs within this many days before
    etf_days: 5                       # 5-day ETF net flows = the last 5 trade dates
    etf_window_days: 9                # ... which must all fall within this many days of T
    etf_subject: "US-{symbol}"        # sosovalue subject (collect.sosovalue.country_code)
    # Inputs whose early history is unrepresentative: observations dated before these are ignored.
    # DefiLlama's total covers ~$0.06bn in 2018 and $0.66bn in Jan 2019 (the market was ~$2.5bn:
    # most USDT was on Omni, apparently untracked), so early % changes measure chain migration,
    # not supply. From 2020 it tracks the market (Jan 2020: $5.2bn). D-039
    valid_from: {stablecoins: "2020-01-01"}

# Regime models (section 6, D-033 Q5/Q6). Stored in `regime` (append-only, versioned) and as
# market features. A change to any of these numbers ships as a new regime version.
regime:
  version: 1
  quadrant:
    # Growth up = Sahm <= the mean of its last sahm_avg_months monthly values (this one included)
    # + sahm_flat_tol (flat counts as falling) AND real GDP QoQ annualized > the mean of its last
    # gdp_avg_quarters values (this one included). Inflation up = core CPI momentum > 0.
    sahm_flat_tol: 0.05
    sahm_avg_months: 3
    gdp_avg_quarters: 4
    inflation_series: CPILFESL
  stress:
    z_window: 252                     # mean of z(VIX), z(BAA10Y), z(-(DGS10 - DGS3MO)), VIX/VIX3M > 1
  hmm:
    states: 3                         # sorted by mean SPY vol into calm < normal < stress (locked)
    covariance: full
    n_seeds: 20                       # restarts with seeds 0..n_seeds-1; best log-likelihood wins
    n_iter: 200
    tol: 1.0e-4
    min_covar: 1.0e-3
    min_weeks: 260                    # weekly samples needed before the first fit
    ret_window: 21                    # SPY 21-session log return
    vol_window: 21                    # SPY 21-session realized vol, annualized
    credit_chg_window: 21             # BAA10Y 21-session change
    annualization: 252
    first_obs: "2007-01-01"           # weekly samples from here (^VIX3M starts 2006-07-17 on yfinance)
    sample_et: "18:00"                # a week's sample is its last session at the decision time
    refit_weekday: 6                  # monthly refit on the first Sunday ...
    refit_et: "06:00"                 # ... at this New York time (the fit is usable from then)
    stability_weeks: 52               # a refit that relabels > 20% of the prior 52 weeks alerts
    stability_threshold: 0.20
    model_dir: models/hmm

# Normalization, masks and staleness (section 7).
normalize:
  z_window: 252                       # rolling z over the last n values (this one included)
  winsor: 4.0                         # z clipped to +-4
  min_frac: 0.9                       # z needs this share of the window finite (data gaps)
  # Time-series z (<name>_tsz252) for these market groups: levels and changes, not features
  # that are already z-scores, one-hots, event counts or staleness counts.
  market_groups: [macro_rates, macro_growth_inflation, credit_vol, cross_asset, framework,
                  risk_appetite, breadth, gli, crypto_ratio, crypto_structure, regime_stress]
  # Per-asset z over the asset's own bars, for classes that are not ranked cross-sectionally
  # (stocks get ranks instead, section 5.2).
  asset_classes: [etf, crypto]
  asset_groups: [price_returns, price_vol, price_trend, price_liquidity, price_market_link,
                 price_mean_reversion]
  mask_windows: [21, 63, 126, 252]   # hist_ok_<n>: the asset has n returns (n + 1 bars)
  # days_since_release for every macro series these market groups read
  staleness_groups: [macro_rates, macro_growth_inflation, credit_vol, cross_asset, framework, gli]
