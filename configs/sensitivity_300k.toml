# Reporting windows (1x costs). The paper's sample ends May 2020; after that is out-of-sample for it.
[[periods]]
name = "to_2020-05 (paper sample)"
end = "2020-06-01"

[[periods]]
name = "2020-06 on (post-paper)"
start = "2020-06-01"
