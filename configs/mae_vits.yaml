# S03: MAE pretraining of Track B's SliceViT (ViT-S/16 + conv stem) on every series of the train cache.
# Every number is a placeholder (HP) until the pilot; `python -m knee.ssl.pretrain_mae --config configs/mae_vits.yaml --pilot 300`
# prints windows/s + peak VRAM and extrapolates the wall-clock for optim.epochs. Dom approves the duration before launch.
run_name: mae_vits_p16_256
seed: 0
precision: auto   # bf16 on the RTX 5070 (sm_120), fp16 + loss scaling on the Kaggle T4 (sm_75)
# cache_dir / run_dir default to <cache_root>/cache_v1_train and <cache_root>/runs/<run_name> (configs/paths.yaml)
model:
  img_size: 256        # HP: MAE resolution (the cache is 384 px; windows are downsampled at load)
  patch: 16
  dim: 384             # ViT-S width
  depth: 12
  heads: 6
  tokenizer: conv_stem
  stem_norm: ln
  pos2d: sincos
  pool: gap
  qk_norm: true
  layerscale: 0.1
  drop_path: 0.0       # MAE usually pretrains without stochastic depth
  attn_impl: sdpa
  grad_checkpointing: false
mae:
  mask_ratio: 0.75
  dec_dim: 256
  dec_depth: 2           # AB.md 2026-10-07 (was 4): MAE paper Table 1a, fine-tune accuracy barely depends on decoder depth
  dec_heads: 8
  norm_pix: true
data:
  out_px: 256
  windows_per_series: 4   # HP: 24,371 series × 4 ≈ 97k windows per epoch
  windows_per_read: 4     # HP: windows cut from one series read (1 = one read per window; 03 plan A3)
  scale: [0.6, 1.0]
  ratio: [0.85, 1.18]
  batch_size: 128         # HP: set from the VRAM table (knee.model.sanity)
  workers: 8              # HP: the loader must keep up; check with scripts/perf/mae_loader_bench.py
  gpu_crop: true          # crop + resize on the GPU (one roi_align per batch; ≤1 grey level from cv2 INTER_AREA);
                          # workers only read. Optional 256-px cache: python -m knee.data.derive_cache (plan A5)
optim:
  blr: 1.5e-4             # lr = blr × batch × accum / 256 (MAE convention)
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_epochs: 2
  epochs: 40              # HP: set from the pilot so the run fits the GPU calendar (Dom approves)
  min_lr_ratio: 0.0
  clip: 1.0
  accum: 1
ckpt_minutes: 30
snapshot_every_epochs: 5
log_every: 50
recon_every_steps: 2000
probe:                    # scripts/run_s03.ps1 -Launch passes labels_v0 / folds_v0 from <cache_root>/labels
  labels: null
  folds: null
  every_epochs: 5
  fold: 0
