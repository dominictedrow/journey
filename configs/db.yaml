# Database settings (D-012, D-017). Credentials come from .env, never from here.
host: localhost
port: 54320          # primary (qt_db); env QT_DB_PORT overrides
backup_port: 54321   # backup (qt_db_backup); env QT_DB_BACKUP_PORT overrides
name: quant_trader
connect_timeout_s: 5
pool:
  min_size: 1
  max_size: 5
  max_idle_s: 300
hypertables:
  raw_prices:  {chunk_days: 30, compress_after_days: 90}
  features:    {chunk_days: 30, compress_after_days: 90}
  predictions: {chunk_days: 90, compress_after_days: 180}
