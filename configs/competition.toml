# TREND02 (candidates #6/#1/#2/#10, ADAPTATION). Pre-registered before any run: the unanimous
# ensemble plus each speed alone, so the report shows which speed (if any) carries the result.
[[modes]]
name = "trend02"

[[modes]]
name = "trend02"
label = "trend02_15m"
params = { speeds = [1] }

[[modes]]
name = "trend02"
label = "trend02_60m"
params = { speeds = [4] }

[[modes]]
name = "trend02"
label = "trend02_4h"
params = { speeds = [16] }

# Reporting windows (1x costs), fixed eras for stability checks.
[[periods]]
name = "2004-2011"
end = "2012-01-01"

[[periods]]
name = "2012-2019"
start = "2012-01-01"
end = "2020-01-01"

[[periods]]
name = "2020 on"
start = "2020-01-01"
