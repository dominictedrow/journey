# Collectors (Phase 2, docs/components/02_collectors.md). Every number for collection lives here.
# Sections are added as each collector is built; the pydantic model rejects unknown keys.

# Point-in-time release rules (component doc section 3). Times are America/New_York.
pit:
  yfinance_xnys_offset_min: 15       # VIX settles 16:15 ET -> session_close + 15 min
  futures_release_et: "17:00"         # CME/ICE daily break (default, accepted S02)
  fred_release_time_et:               # vintage date at this time ET
    # 18:00, not 17:00: BAA10Y/T10YIE post at ~17:04 ET on their vintage date (probe
    # 2026-11-25). No scheduled decision falls between 17:00 and 18:00 ET (D-029)
    default: "18:00"
    BAMLH0A0HYM2: "12:00"             # with the 1-session lag below
    VIXCLS: "12:00"
    CPIAUCSL: "08:30"
    CPILFESL: "08:30"
    UNRATE: "08:30"
    PAYEMS: "08:30"
    PCEPI: "08:30"
    PCEPILFE: "08:30"
    GDPC1: "08:30"
  # ALFRED stamps these with the observation date, but FRED posts them the next business
  # morning (~10:15 ET, last_updated probe 2026-11-25): release = next XNYS session at the time
  # above. Without this the 00:15 UTC crypto decision would see a value ~15 h early (D-029)
  fred_release_lag_sessions: {BAMLH0A0HYM2: 1, VIXCLS: 1}
  edgar_fallback_days: 1              # no acceptanceDateTime -> filed + 1 day at 00:00 ET
  fomc_schedule_known: {month: 12, day: 1}   # Dec 1 of the preceding year
  congress_backfill_et: "23:59:59"
  earnings_backfill_lead_days: 7      # backfilled report dates: report date - 7 days, approx
  sosovalue_history_et: "09:00"       # trade date + 1 day at 09:00 ET

http:
  timeout_s: 20
  retries: 3                          # attempts after the first one
  backoff_base_s: 2
  backoff_max_s: 60
  jitter_s: 1
  user_agent: "qt-collector/0.1"
  per_host_rps:
    default: 2
    data.alpaca.markets: 3
    api.stlouisfed.org: 1.5           # ~120 req/min limit; stay under it
    www.sec.gov: 8                    # SEC fair access: <= 10 req/s
    data.sec.gov: 8
    api.congress.gov: 4               # api.data.gov: 20,000 req/h (header, probe 2026-11-26)
    api.coingecko.com: 0.4            # Demo: 30 calls/min
    api.nasdaq.com: 1
    www.okx.com: 4                    # public: 10 req / 2 s
    api.hyperliquid.xyz: 0.5          # 429s at 2 req/s (backfill 2026-11-26)

# Freshness: Phase 2 records and alerts; Phase 5 turns stale critical feeds into NO TRADE.
freshness:
  default: {critical: false, max_hours: 48}
  # session_paced: max_hours counts from the first missed session decision time (16:30 ET, or
  # 13:30 on early closes), not from the last ok run, so weekends/holidays aren't stale (D-029)
  collectors:                         # keys = collector names (<= 13 chars: run stage is collect_<name>)
    bars_equity: {critical: true, max_hours: 6, session_paced: true}
    bars_crypto: {critical: true, max_hours: 26}
    alpaca_assets: {critical: true, max_hours: 6, session_paced: true}
    crypto_assets: {critical: true, max_hours: 26}
    membership: {critical: false, max_hours: 192}   # weekly
    aliases: {critical: false, max_hours: 192}
    fred: {critical: true, max_hours: 6, session_paced: true}
    hy_archive: {critical: false, max_hours: 6, session_paced: true}
    news: {critical: true, max_hours: 2}
    fed_rss: {critical: false, max_hours: 2}       # polled with news every 15 min
    funding: {critical: true, max_hours: 26}
    crypto_oi: {critical: false, max_hours: 26}
    coingecko: {critical: false, max_hours: 26}
    defillama: {critical: false, max_hours: 26}
    yfinance: {critical: false, max_hours: 6, session_paced: true}
    corp_actions: {critical: false, max_hours: 6, session_paced: true}
    edgar_facts: {critical: false, max_hours: 192}
    congress: {critical: false, max_hours: 26}
    earnings: {critical: false, max_hours: 72}

# News (D-008, D-022). Every article is stored; filtering happens downstream (Phase 8).
news:
  min_words: 150                      # below this: extract_status = 'short' (still stored)
  simhash: {bits: 64, shingle: 5, max_hamming: 3, window_days: 30}
  archive_dir: data/news_archive      # raw HTML, YYYY/MM/DD/<source>.jsonl.gz
  max_new_per_feed: 100               # safety cap per loop
  feed_fail_alert_after: 4            # consecutive failed fetches of one feed (= 1 h) -> critical alert
  feeds:
    cointelegraph: https://cointelegraph.com/rss
    decrypt: https://decrypt.co/feed
    cnbc_markets: https://www.cnbc.com/id/100003114/device/rss/rss.html
    bbc_business: https://feeds.bbci.co.uk/news/business/rss.xml
    npr_economy: https://feeds.npr.org/1006/rss.xml

# Fed RSS, polled in the news loop so first-seen times are accurate (component doc 6.7).
fed:
  feeds:                              # order matters: an item in several feeds keeps the first kind
    press_monetary: https://www.federalreserve.gov/feeds/press_monetary.xml
    speeches: https://www.federalreserve.gov/feeds/speeches.xml
    press_all: https://www.federalreserve.gov/feeds/press_all.xml
  kind_rules:                         # first regex match on the title wins (case-insensitive)
    - {pattern: "issues FOMC statement", kind: fomc_statement}
    - {pattern: "^Minutes of the Federal Open Market Committee", kind: minutes}
    - {pattern: "economic projections", kind: projections}
    - {pattern: "schedule of Federal Open Market Committee meetings", kind: fomc_schedule}
  feed_default_kind: {press_monetary: press, speeches: speech, press_all: press}
  speaker_roles:                      # speeches feed titles are "<Surname>, <title>". Roles confirmed by Dom 2026-11-26.
    Warsh: Chair
    Jefferson: Vice Chair
    Bowman: Vice Chair for Supervision
    Barr: Governor
    Cook: Governor
    Waller: Governor
    Miran: Governor
  default_role: Board                 # unmapped surname: logged as fed_speaker_unmapped
  feed_fail_alert_after: 4

# Scheduler (component doc section 7). APScheduler 3.x, timezone America/New_York.
# The backup time comes from backup.yaml (evening_time_et); the stock job from calendar.yaml.
# Universe (D-025): S&P 500 members since membership_start + these ETFs + the crypto pool.
universe:
  index: SPX
  candidates: 80                      # weekly screen output size, used in Phase 3
  membership_start: "2016-01-01"
  extra_etfs: [SPY, QQQ, VNQ, XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]

# Alpaca market data (component doc 6.1). The trading API URL is the hard-coded paper URL.
alpaca:
  data_url: https://data.alpaca.markets
  stock_feed: sip                     # free for data older than 15 min
  recent_guard_min: 20                # never request bars newer than this (free SIP limit)
  page_limit: 10000
  # adjustment -> raw_prices.source. Raw only: adjusted bars are adjusted as of the fetch, so an
  # append-only store would mix adjustment bases after each new split. Phase 3 adjusts from raw
  # + corporate actions (step 5) instead (D-030, supersedes the 6.1 alpaca_adj default)
  adjustments: {raw: alpaca}
  multi_symbols: 100                  # symbols per request for daily increments
  prices_start: "2016-01-01"
  crypto_loc: us
  crypto_start: "2021-01-01"          # Alpaca's earliest daily crypto bar (probe 2026-11-25)

crypto:
  quote: USD
  stablecoin_exclude: [USDC, USDT, DAI, PYUSD, USDG]

# S&P 500 membership (6.5). fja05680 history to its last update, then our weekly Wikipedia
# snapshots. Securities are traced across renames by identical bars (D-030).
membership:
  fja_url: "https://raw.githubusercontent.com/fja05680/sp500/master/S%26P%20500%20Historical%20Components%20%26%20Changes%20(Updated).csv"
  wikipedia_url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
  wikipedia_table_id: constituents
  wikipedia_min_rows: 450             # fewer rows than this = the page layout changed
  gap_sessions: 10                    # a bar gap longer than this ends a security
  rename_lookback_days: 10            # window for an old ticker's last bar before a change
  crosscheck_report: reports/membership_crosscheck.md

# SEC EDGAR (6.4). The User-Agent comes from SEC_EDGAR_USER_AGENT (secret: has Dom's email).
edgar:
  tickers_url: https://www.sec.gov/files/company_tickers.json
  max_rps: 10
  # Per-company companyfacts + submissions, not the weekly companyfacts.zip bulk file: the zip is
  # ~1.4 GB, while ~600 mapped CIKs at 8 req/s take a few minutes, and an unchanged filer (same
  # newest accession as last week) is skipped (D-031)
  facts_url: https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json
  submissions_url: https://data.sec.gov/submissions/CIK{cik}.json
  submissions_file_url: https://data.sec.gov/submissions/{name}
  cache_dir: data/cache/edgar           # older submissions pages never change: cached for good
  concepts:                             # taxonomy:concept -> raw_fundamentals.metric (all units)
    - us-gaap:Revenues
    - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
    - us-gaap:SalesRevenueNet
    - us-gaap:GrossProfit
    - us-gaap:OperatingIncomeLoss
    - us-gaap:NetIncomeLoss
    - us-gaap:EarningsPerShareDiluted
    - us-gaap:EarningsPerShareBasic
    - us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding
    - us-gaap:Assets
    - us-gaap:Liabilities
    - us-gaap:StockholdersEquity
    - us-gaap:CashAndCashEquivalentsAtCarryingValue
    - us-gaap:LongTermDebt
    - us-gaap:LongTermDebtNoncurrent
    - us-gaap:NetCashProvidedByUsedInOperatingActivities
    - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
    - us-gaap:CommonStockDividendsPerShareDeclared
    - dei:EntityCommonStockSharesOutstanding

# yfinance (6.2): spec tickers daily + index-level history from 2000 for the HMM. Never mixed with
# Alpaca rows (source 'yfinance'). Close is yfinance's split-adjusted close (its "raw" close).
yfinance:
  start: "2000-01-01"
  tickers:                              # ticker -> pit rule (xnys | futures_fx) and asset_class
    SPY: {rule: xnys, asset_class: etf}
    QQQ: {rule: xnys, asset_class: etf}
    XLB: {rule: xnys, asset_class: etf}
    XLE: {rule: xnys, asset_class: etf}
    XLF: {rule: xnys, asset_class: etf}
    XLI: {rule: xnys, asset_class: etf}
    XLK: {rule: xnys, asset_class: etf}
    XLP: {rule: xnys, asset_class: etf}
    XLU: {rule: xnys, asset_class: etf}
    XLV: {rule: xnys, asset_class: etf}
    XLY: {rule: xnys, asset_class: etf}
    "^VIX": {rule: xnys, asset_class: index}
    "^VIX3M": {rule: xnys, asset_class: index}
    "NQ=F": {rule: futures_fx, asset_class: future}
    "GC=F": {rule: futures_fx, asset_class: future}
    "DX-Y.NYB": {rule: futures_fx, asset_class: fx}
  refetch_days: 10                      # daily runs re-request this many days (ON CONFLICT skips)
  sleep_s: 1.0                          # between tickers (yfinance has no published limit)
  cache_dir: data/cache/yfinance

# Alpaca corporate actions (D-030: Phase 3 adjusts raw bars from these). raw_events, source
# 'alpaca_ca'. released_at = min(fetch time, ex/effective date 00:00 ET) (D-031).
corp_actions:
  start: "2016-01-01"
  lookahead_days: 90                    # daily runs also fetch announced future actions
  refetch_days: 30
  symbols_per_request: 100
  page_limit: 1000

# Congress.gov (6.8). Bills are listed per congress (title + latest action); actions are fetched
# only for bills that moved after introduction or match a tag; a bill is kept if any action
# touches one of the committees or it has a tag. Backfill runs in budgeted slices (D-031).
congress:
  base_url: https://api.congress.gov/v3
  first_congress: 114                   # 2015-2016: covers the 2016 price start
  committees: [hswm00, hsba00, hsap00, hsbu00, ssfi00, ssbk00, ssap00, ssbu00]
  page_limit: 250
  backfill_budget: 4000                 # actions requests per run for the backfill slice
  status_rules:                         # first match wins: action type (optional) + text regex
    - {status: became_law, type: BecameLaw, pattern: "."}
    - {status: vetoed, pattern: "^Vetoed by President|Veto message"}
    - {status: to_president, type: President, pattern: "^Presented to President"}
    - {status: resolving_differences, type: ResolvingDifferences, pattern: "."}
    - {status: passed_house, pattern: "^Passed/agreed to in House"}
    - {status: passed_senate, pattern: "^Passed/agreed to in Senate"}
    - {status: reported, type: Committee, pattern: "^(Reported|Ordered to be reported)"}
  event_statuses: [reported, passed_house, passed_senate, resolving_differences, to_president,
                   became_law, vetoed]
  tags:                                 # title or action text regex (case-insensitive)
    debt_ceiling: "debt (ceiling|limit)|public debt limit|statutory limit on the public debt"
    cr_shutdown: "continuing appropriations|continuing resolution|government shutdown|lapse in appropriations"

# Earnings calendar (6.9): api.nasdaq.com (unofficial; needs a browser-like UA). Finnhub fallback
# is not built: no key (D-031). Rows for tickers ever in the universe only.
earnings:
  url: https://api.nasdaq.com/api/calendar/earnings
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
  lookahead_days: 28
  backfill_start: "2016-01-01"
  backfill_budget: 600                  # calendar days per run for the backfill slice

