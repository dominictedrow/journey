  history_days: 365                     # Demo plan limit (probe 2026-11-26: 400 above 365)
  refetch_days: 30
  ids:                                  # Alpaca pool symbol -> CoinGecko id (markets probe 2026-11-26)
    AAVE: aave
    ADA: cardano
    ARB: arbitrum
    AVAX: avalanche-2
    BAT: basic-attention-token
    BCH: bitcoin-cash
    BONK: bonk
    BTC: bitcoin
    CRV: curve-dao-token
    DOGE: dogecoin
    DOT: polkadot
    ETH: ethereum
    FIL: filecoin
    GRT: the-graph
    HYPE: hyperliquid
    LDO: lido-dao
    LINK: chainlink
    LTC: litecoin
    ONDO: ondo-finance
    PAXG: pax-gold
    PEPE: pepe
    POL: polygon-ecosystem-token
    RENDER: render-token
    SHIB: shiba-inu
    SKY: sky
    SOL: solana
    SUSHI: sushi
    TRUMP: official-trump
    UNI: uniswap
    WIF: dogwifcoin
    XRP: ripple
    XTZ: tezos
    YFI: yearn-finance

defillama:
  stablecoins_url: https://stablecoins.llama.fi/stablecoincharts/all

derivs:
  symbols: [BTC, ETH, SOL]
  funding_start: "2023-06-01"           # Hyperliquid backfill start; OKX serves ~3 months only
  okx:
    base_url: https://www.okx.com/api/v5/public
    inst: {BTC: BTC-USDT-SWAP, ETH: ETH-USDT-SWAP, SOL: SOL-USDT-SWAP}
    default_interval_h: 8
    page_limit: 100
  hyperliquid:
    url: https://api.hyperliquid.xyz/info
    interval_h: 1
  deribit:
    url: https://www.deribit.com/api/v2/public/get_book_summary_by_instrument
    # oi_unit: what open_interest is quoted in (inverse perps: USD; linear USDC perps: base coin)
    inst:
      BTC: {name: BTC-PERPETUAL, oi_unit: usd}
      ETH: {name: ETH-PERPETUAL, oi_unit: usd}
      SOL: {name: SOL_USDC-PERPETUAL, oi_unit: base}
  kraken:
    url: https://futures.kraken.com/derivatives/api/v3/tickers/{symbol}
    inst: {BTC: PF_XBTUSD, ETH: PF_ETHUSD, SOL: PF_SOLUSD}   # openInterest in base coin

# FRED / ALFRED (component doc 6.3, D-023). Every vintage of every series -> raw_macro
# (source 'alfred'); release times are in pit.fred_release_time_et.
fred:
  base_url: https://api.stlouisfed.org/fred
  series: [DGS3MO, DGS2, DGS10, DFII10, T10YIE, DFF, BAMLH0A0HYM2, BAA10Y, VIXCLS,
           CPIAUCSL, CPILFESL, PCEPI, PCEPILFE, UNRATE, PAYEMS, GDPC1,
           WALCL, WTREGEN, RRPONTSYD, ECBASSETSW, JPNASSETS, DEXUSEU, DEXJPUS]
  realtime_origin: "1776-07-04"       # ALFRED's "all vintages" start
  # API limit is 2000 vintage dates per realtime range (HTTP 400 above), but FRED's count can run
  # 1 higher than its vintagedates list: keep a margin; a 400 still splits the window in half
  max_vintages_per_request: 1900
  page_limit: 100000                  # API max rows per observations page
  # FRED serves only the last ~3 years of ICE BofA series: snapshot the current values daily
  # (source 'fred_archive', released_at = fetch time) so history accumulates (D-001)
  archive_series: [BAMLH0A0HYM2]

schedule:
  news_every_min: 15
  crypto_utc: "00:15"
  congress_et: "06:00"
  earnings_et: "07:00"
  replan_et: "06:00"                  # stock_daily re-plans itself for the day's session
  weekly: {day: sun, time_et: "18:00"}
  summary_et: "21:30"
  heartbeat_min: 5
  heartbeat_gap_min: 15               # daily summary flags heartbeat gaps longer than this
  freshness_check_min: 30             # stale critical feeds alert once, on turning stale
  misfire_grace_s: 900
  run_dir: data/run
