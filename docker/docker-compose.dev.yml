# Dev overrides: hot reload + bind mounts.
# docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up
services:
  # Migrations run in the one-shot `migrate` service (base compose); bind-mount so it applies
  # the local migration scripts in dev, not the baked image's.
  migrate:
    volumes:
      - ../backend:/app

  api:
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../backend:/app

  worker:
    volumes:
      - ../backend:/app

  beat:
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: deps
    command: sh -c "npm run dev"
    volumes:
      - ../frontend:/app
      - /app/node_modules
